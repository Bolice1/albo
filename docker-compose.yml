# Albo Backend & AI Services Full Local Stack
# Reference: docs/05-development-standards/DEPLOYMENT.md §2 & ADR-008 / ADR-016
# Note: Only `core-api` publishes a host port (bound strictly to 127.0.0.1:4000).
# `postgres`, `redis`, `minio`, `ai-services`, and `job-worker` remain isolated on `private`.

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres} # ggignore
      POSTGRES_DB: ${POSTGRES_DB:-albo_dev}
    volumes:
      - albo_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/01-init-postgis.sql:ro
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-albo_dev}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - albo_redis_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: elestio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin} # ggignore
    volumes:
      - albo_minio_data:/data
    networks:
      - private
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["bun", "x", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-albo_dev}?schema=public # ggignore
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - private
    restart: "no"

  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      INTERNAL_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-example_placeholder_internal_service_token_local_only} # ggignore
      ASSISTANT_ENABLED: ${FEATURE_ASSISTANT_ENABLED:-false}
      CHECKIN_SAFETY_ENABLED: "true"
      ENABLED_RULE_VERSIONS: ${APPROVED_RISK_RULE_VERSIONS:-lifestyle_ncd_preventive:rules-v1.0.0}
    networks:
      - private
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  core-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-albo_dev}?schema=public # ggignore
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-services:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-example_placeholder_internal_service_token_local_only} # ggignore
      AI_SERVICE_TIMEOUT_MS: "2000"
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.synthetic.albo.invalid}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-albo-core-api}
      JWT_HS256_SECRET: ${JWT_HS256_SECRET:-example_placeholder_jwt_signing_secret_key_local_only} # ggignore
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-albo-synthetic-reports}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin} # ggignore
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FEATURE_ASSISTANT_ENABLED: ${FEATURE_ASSISTANT_ENABLED:-false}
      FEATURE_PROVIDER_PORTAL_ENABLED: ${FEATURE_PROVIDER_PORTAL_ENABLED:-false}
      FEATURE_CHECKINS_ENABLED: ${FEATURE_CHECKINS_ENABLED:-false}
      APPROVED_RISK_RULE_VERSIONS: ${APPROVED_RISK_RULE_VERSIONS:-lifestyle_ncd_preventive:rules-v1.0.0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-services:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - private

  job-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["bun", "dist/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-albo_dev}?schema=public # ggignore
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-services:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-example_placeholder_internal_service_token_local_only} # ggignore
      AI_SERVICE_TIMEOUT_MS: "2000"
      JWT_ISSUER: ${JWT_ISSUER:-https://auth.synthetic.albo.invalid}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-albo-core-api}
      JWT_HS256_SECRET: ${JWT_HS256_SECRET:-example_placeholder_jwt_signing_secret_key_local_only} # ggignore
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-albo-synthetic-reports}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin} # ggignore
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FEATURE_ASSISTANT_ENABLED: ${FEATURE_ASSISTANT_ENABLED:-false}
      FEATURE_PROVIDER_PORTAL_ENABLED: ${FEATURE_PROVIDER_PORTAL_ENABLED:-false}
      FEATURE_CHECKINS_ENABLED: ${FEATURE_CHECKINS_ENABLED:-false}
      APPROVED_RISK_RULE_VERSIONS: ${APPROVED_RISK_RULE_VERSIONS:-lifestyle_ncd_preventive:rules-v1.0.0}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'bun dist/worker.js' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-services:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - private

networks:
  edge:
    driver: bridge
  private:
    driver: bridge
    internal: true

volumes:
  albo_postgres_data:
  albo_redis_data:
  albo_minio_data:
